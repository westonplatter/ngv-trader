# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.7.4
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - node@22.16.0
    - python@3.10.8
lint:
  definitions:
    - name: black
      commands:
        - name: format
          run: black --line-length 160 ${target}
  enabled:
    - actionlint@1.7.11
    - bandit@1.9.4
    - black@26.1.0
    - checkov@3.2.506
    - git-diff-check
    - isort@8.0.0
    - markdownlint@0.47.0
    - osv-scanner@2.3.3
    - prettier@3.8.1
    - ruff@0.15.2
    - svgo@4.0.0
    - taplo@0.10.0
    - trufflehog@3.93.4
    - yamllint@1.38.0
  ignore:
    # bandit B101 flags every `assert`, which is how pytest expresses its
    # checks. Tests are not shipped and never run under `python -O`.
    - linters: [bandit]
      paths:
        - tests/**
actions:
  definitions:
    # Block a commit that would introduce real IBKR identifiers. The script is
    # pure stdlib, so the hook works without uv or a synced virtualenv.
    - id: ibkr-sensitive-data-check
      display_name: IBKR sensitive data
      description: Reject staged changes containing real IBKR account/contract/execution IDs
      run: python3 scripts/ibkr_sensitive_data_check.py --quiet
      triggers:
        - git_hooks: [pre-commit]
  enabled:
    - ibkr-sensitive-data-check
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
