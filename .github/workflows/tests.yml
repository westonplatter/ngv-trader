name: tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Run pytest suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Matches the local Postgres major version (17).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # tests/conftest.py forces DB_NAME to ngv_trader_test and creates it on demand.
      # TEST_ENV_FILE points at a file that does not exist in CI so no .env is loaded.
      TEST_ENV_FILE: .env.ci
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # --extra mcp so src/mcp/semantic_server.py is importable; the import
      # canary in tests/test_imports.py covers every module under src/.
      - name: Install dependencies
        run: uv sync --group dev --extra mcp

      - name: Run tests
        run: uv run --group dev --extra mcp pytest

  frontend:
    name: Run frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installed from npm rather than a setup-bun action: the runner already
      # ships node/npm, and this keeps the workflow to actions/checkout alone
      # instead of taking on a second third-party action.
      - name: Install bun
        run: npm install -g bun@1.3.11

      # --frozen-lockfile so a dependency bump has to come through a lockfile
      # change rather than resolving differently in CI.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Ordered cheapest-signal-first. typecheck is `tsc -b --force`, which
      # walks the project references; plain `tsc --noEmit` against the root
      # tsconfig checks nothing, since it is a solution file with `files: []`.
      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

      - name: Build
        run: bun run build
