version: 2

updates:
  # Python backend (uv: pyproject.toml + uv.lock at repo root)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # Mirror the repo's 14-day supply-chain cooldown (AGENTS.md; uv --exclude-newer).
    cooldown:
      default-days: 14
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

  # Frontend (bun: frontend/package.json + frontend/bun.lock)
  - package-ecosystem: "bun"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    # Mirror frontend/bunfig.toml minimumReleaseAge (1209600s = 14 days).
    cooldown:
      default-days: 14
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

  # GitHub Actions workflows (.github/workflows/)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci(deps)"
