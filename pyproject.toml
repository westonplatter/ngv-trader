[project]
name = "ngv-trader"
version = "0.1.8"
description = "Review market price action, monitor portfolio strategies, and execute live trades with AI"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "ib-async>=2.1.0",
  "langgraph>=1.2.9",
  "python-dotenv>=1.2.1",
  "ngv_reports_ibkr @ git+https://github.com/westonplatter/ngv_reports_ibkr.git@v0.5.0",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "psycopg2-binary>=2.9",
  "pandera[pandas]>=0.20",
  "fastapi>=0.139.2",
  "uvicorn[standard]>=0.34",
  "defusedxml>=0.7.1",
]

[project.optional-dependencies]
# Semantic-layer MCP server (src/mcp/semantic_server.py). Install with
# `uv sync --extra mcp` or run via `uv run --extra mcp`.
mcp = ["mcp>=1.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
default-groups = []

[dependency-groups]
dev = ["typer>=0.27.0", "ipdb>=0.13.13", "ruff>=0.15.2"]

# -- Ruff: complexity guardrails ----------------------------------------------
[tool.ruff.lint]
select = [
  "C901",    # McCabe cyclomatic complexity
  "PLR0911", # too-many-return-statements
  "PLR0912", # too-many-branches
  "PLR0913", # too-many-arguments
  "PLR0915", # too-many-statements
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6
max-statements = 50
max-branches = 8
max-returns = 5

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0915", "PLR0913"]
